name: Daily BESS Data Update

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (π.χ. 2026-06-10)'
        required: false
        type: string
      end_date:
        description: 'End Date (π.χ. 2026-09-15)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl xlrd

      - name: Run Data Extraction Script
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: python update_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historical.json
          
          if git diff --staged --quiet; then
            echo "Δεν βρέθηκαν νέα δεδομένα (ή δεν υπάρχει αλλαγή). Παράβλεψη commit."
          else
            git commit -m "Auto-update BESS data 🤖 [skip ci]"
            git push
          fi
