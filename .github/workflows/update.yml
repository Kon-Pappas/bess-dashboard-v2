name: Daily BESS Data Update

# Εκκίνηση ΜΟΝΟ από το εξωτερικό cron-job.org, κάθε μέρα στις 07:04 ώρα Ελλάδος (D05).
# Δεν υπάρχει block `schedule:`: το cron του GitHub καθυστερεί και, δίπλα στο εξωτερικό,
# έτρεχε τη λήψη δεύτερη φορά κάθε μέρα. Χειροκίνητα: Actions → Run workflow (με ή χωρίς ημερομηνίες).
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (π.χ. 2026-06-10)'
        required: false
        type: string
      end_date:
        description: 'End Date (π.χ. 2026-09-15)'
        required: false
        type: string

permissions:
  contents: write

# Μία εκτέλεση τη φορά: αν τρέχει ήδη backfill ή η καθημερινή λήψη, η επόμενη περιμένει (δεν ακυρώνει αυτή που τρέχει).
# Έτσι δύο εκτελέσεις δεν γράφουν ταυτόχρονα στο data/historical.json.
concurrency:
  group: update-bess-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl xlrd

      - name: Run Data Extraction Script
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: python update_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historical.json data/meta.json data/capacity.json

          if git diff --staged --quiet; then
            echo "Δεν βρέθηκαν νέα δεδομένα (ή δεν υπάρχει αλλαγή). Παράβλεψη commit."
          else
            git commit -m "Auto-update BESS data 🤖 [skip ci]"
            git push
          fi
